<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7f7f7"/>
  <rect x="0" y="0" width="1400" height="90" fill="#1f2937"/>
  <text x="60" y="57" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Excel Sales Analysis Dashboard</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Portfolio project • Microsoft Excel • PivotTables • PivotCharts • Slicers</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="155" rx="14" width="235" height="120" fill="#ffffff" stroke="#d1d5db"/>
    <text x="85" y="190" font-size="17" fill="#6b7280">Total Revenue</text>
    <text x="85" y="240" font-size="31" font-weight="700" fill="#111827">£2.328B</text>

    <rect x="320" y="155" rx="14" width="235" height="120" fill="#ffffff" stroke="#d1d5db"/>
    <text x="345" y="190" font-size="17" fill="#6b7280">Total COGS</text>
    <text x="345" y="240" font-size="31" font-weight="700" fill="#111827">£1.863B</text>

    <rect x="580" y="155" rx="14" width="235" height="120" fill="#ffffff" stroke="#d1d5db"/>
    <text x="605" y="190" font-size="17" fill="#6b7280">Total Profit</text>
    <text x="605" y="240" font-size="31" font-weight="700" fill="#111827">£465.674M</text>

    <rect x="840" y="155" rx="14" width="235" height="120" fill="#ffffff" stroke="#d1d5db"/>
    <text x="865" y="190" font-size="17" fill="#6b7280">Profit Margin</text>
    <text x="865" y="240" font-size="31" font-weight="700" fill="#111827">20.0%</text>

    <rect x="1100" y="155" rx="14" width="235" height="120" fill="#ffffff" stroke="#d1d5db"/>
    <text x="1125" y="190" font-size="17" fill="#6b7280">Customers</text>
    <text x="1125" y="240" font-size="31" font-weight="700" fill="#111827">121</text>

    <rect x="60" y="315" rx="14" width="620" height="420" fill="#ffffff" stroke="#d1d5db"/>
    <text x="90" y="355" font-size="22" font-weight="700" fill="#111827">Key Findings</text>
    <text x="100" y="410" font-size="19" fill="#374151">• Peter generated the highest sales-rep revenue: £434.805M</text>
    <text x="100" y="455" font-size="19" fill="#374151">• Laptop A13 produced the highest product profit: £105.336M</text>
    <text x="100" y="500" font-size="19" fill="#374151">• Lagos recorded the highest COGS: £493.812M</text>
    <text x="100" y="545" font-size="19" fill="#374151">• March was the strongest profit month: £126.688M</text>
    <text x="100" y="590" font-size="19" fill="#374151">• Overall profit margin: 20%</text>
    <text x="90" y="680" font-size="16" fill="#6b7280">Based on 2,098 transactional sales records.</text>

    <rect x="720" y="315" rx="14" width="615" height="420" fill="#ffffff" stroke="#d1d5db"/>
    <text x="750" y="355" font-size="22" font-weight="700" fill="#111827">Analysis Areas</text>
    <text x="760" y="415" font-size="20" fill="#374151">Revenue by Sales Representative</text>
    <line x1="760" y1="430" x2="1260" y2="430" stroke="#e5e7eb"/>
    <text x="760" y="480" font-size="20" fill="#374151">Profit by Product</text>
    <line x1="760" y1="495" x2="1260" y2="495" stroke="#e5e7eb"/>
    <text x="760" y="545" font-size="20" fill="#374151">COGS by City</text>
    <line x1="760" y1="560" x2="1260" y2="560" stroke="#e5e7eb"/>
    <text x="760" y="610" font-size="20" fill="#374151">Monthly Profit Trend</text>
    <line x1="760" y1="625" x2="1260" y2="625" stroke="#e5e7eb"/>
    <text x="760" y="680" font-size="20" fill="#374151">Interactive Excel Slicers</text>
  </g>

  <text x="60" y="785" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Elizabeth Erhunmwunsee • Data Analysis | Excel | Business Intelligence</text>
</svg>